version: '3.8'

services:
  legado-web:
    image: legado-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legado-web
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      # 持久化数据库与导入的书籍文件（TXT/EPUB/PDF/封面）
      - ./data:/app/data
      # 持久化后端运行日志与错误排查日志
      - ./logs:/app/logs
    environment:
      - PORT=8081
      - LEGADO_DATA=/app/data
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8081/api/sources/health/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
